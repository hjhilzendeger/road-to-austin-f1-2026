name: Update F1 race results
on:
  schedule:
    - cron: '17 * * * 0,1,5,6'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch and validate results
        run: node scripts/update-f1-results.mjs
      - name: Commit changes
        run: |
          if ! git diff --quiet -- public/f1-2026-data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/f1-2026-data.json
            git commit -m "data: import new F1 classifications"
            git push
          fi
